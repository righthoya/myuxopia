  </defs>
  <rect x="0" y="0" width="200" height="215" fill="#f2f2f2"/>
  <rect x="200" y="0" width="220" height="215" fill="#fafafa"/>
  <rect x="420" y="0" width="110" height="215" fill="#f2f2f2"/>
  <rect x="530" y="0" width="110" height="215" fill="#fafafa"/>
