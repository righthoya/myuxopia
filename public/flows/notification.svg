<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="768" height="456" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
  <!-- 알림 발송·확인 흐름 (피그마 'UX 표준 정책' 58:170 기준, 흑백). 레인: 발생 · 발송 · 확인 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="90" fill="#f2f2f2"/>
  <rect x="0" y="90" width="640" height="180" fill="#fafafa"/>
  <rect x="0" y="270" width="640" height="110" fill="#f2f2f2"/>
  <g font-weight="bold" text-anchor="start"><text x="10" y="18">발생</text><text x="10" y="108">발송</text><text x="10" y="288">확인</text></g>

  <g fill="none" stroke="#111" stroke-width="1.2">
    <path d="M110,68 V142 H188" marker-end="url(#a)"/>
    <path d="M310,142 H343" marker-end="url(#a)"/>
    <path d="M250,165 V198" marker-end="url(#a)"/>
    <path d="M465,142 H498" marker-end="url(#a)"/>
    <path d="M405,167 V285 H190 V298" marker-end="url(#a)"/>
    <path d="M260,325 H288" marker-end="url(#a)"/>
    <path d="M430,325 H458" marker-end="url(#a)"/>
  </g>

  <g fill="#fff" stroke="#111">
    <rect x="40" y="28" width="140" height="40"/>
    <rect x="190" y="120" width="120" height="45"/>
    <rect x="345" y="117" width="120" height="50"/>
    <rect x="500" y="117" width="130" height="50"/>
    <rect x="175" y="200" width="150" height="50"/>
    <rect x="120" y="300" width="140" height="50"/>
    <rect x="290" y="300" width="140" height="50"/>
    <rect x="460" y="300" width="140" height="50"/>
  </g>

  <g fill="#111">
    <text x="110" y="45">이벤트 발생</text><text x="110" y="60" font-size="10">시스템·업무·보안·마케팅</text>
    <text x="250" y="138">수신 설정 확인</text><text x="250" y="155" font-size="10">유형·채널별</text>
    <text x="405" y="138">인앱 알림 등록</text><text x="405" y="155" font-size="10">중요도 표시</text>
    <text x="565" y="138">외부 채널 발송</text><text x="565" y="155" font-size="10">이메일·브라우저 푸시</text>
    <text x="250" y="221">발송 안 함</text><text x="250" y="238" font-size="10">필수 알림은 설정 무관 발송</text>
    <text x="190" y="321">헤더 알림 아이콘</text><text x="190" y="338" font-size="10">읽지 않은 건수 표시</text>
    <text x="360" y="321">알림 목록 확인</text><text x="360" y="338" font-size="10">유형별 필터</text>
    <text x="530" y="321">읽음 처리 후</text><text x="530" y="337">관련 화면 이동</text>
  </g>

  <g fill="#555" font-size="10">
    <text x="326" y="112">수신 ON</text>
    <text x="256" y="186" text-anchor="start">수신 OFF</text>
    <text x="481" y="108">채널 수신 ON</text>
  </g>
</svg>
