<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
  <!-- 개인정보 수집 동의 흐름 (피그마 'UX 표준 정책' 61:170 기준, 흑백). 레인: 진입 · 동의 · 완료 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="90" fill="#f2f2f2"/>
  <rect x="0" y="90" width="640" height="180" fill="#fafafa"/>
  <rect x="0" y="270" width="640" height="110" fill="#f2f2f2"/>
  <g font-weight="bold" text-anchor="start"><text x="10" y="18">진입</text><text x="10" y="108">동의</text><text x="10" y="288">완료</text></g>

  <g fill="none" stroke="#111" stroke-width="1.2">
    <path d="M110,68 V142 H188" marker-end="url(#a)"/>
    <path d="M310,142 H343" marker-end="url(#a)"/>
    <path d="M405,167 V198" marker-end="url(#a)"/>
    <path d="M465,142 H498" marker-end="url(#a)"/>
    <path d="M565,167 V298" marker-end="url(#a)"/>
    <path d="M500,325 H482" marker-end="url(#a)"/>
  </g>

  <g fill="#fff" stroke="#111">
    <rect x="40" y="28" width="140" height="40"/>
    <rect x="190" y="117" width="120" height="50"/>
    <rect x="345" y="117" width="120" height="50"/>
    <rect x="500" y="117" width="130" height="50"/>
    <rect x="335" y="200" width="140" height="50"/>
    <rect x="500" y="300" width="130" height="50"/>
    <rect x="330" y="300" width="150" height="50"/>
  </g>

  <g fill="#111">
    <text x="110" y="45">개인정보 입력 화면</text><text x="110" y="60" font-size="10">가입·문의 등</text>
    <text x="250" y="138">수집 항목·목적 안내</text><text x="250" y="155" font-size="10">필수·선택 구분</text>
    <text x="405" y="146">필수 항목 동의 확인</text>
    <text x="565" y="138">선택 항목 동의</text><text x="565" y="155" font-size="10">거부 가능</text>
    <text x="405" y="221">진행 불가 안내</text><text x="405" y="238" font-size="10">필수 항목 미동의</text>
    <text x="565" y="321">동의 일시·</text><text x="565" y="337">약관 버전 기록</text>
    <text x="405" y="321" font-weight="bold">가입·요청 처리 완료</text><text x="405" y="338" font-size="10">내 정보에서 동의 철회 가능</text>
  </g>

  <g fill="#555" font-size="10">
    <text x="481" y="108">동의</text>
    <text x="411" y="186" text-anchor="start">미동의</text>
  </g>
</svg>
